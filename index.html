<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Mazmorra del Tiempo - EcoPrince 2D</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>⏳ La Mazmorra del Tiempo</h1>
            <div id="hud">Vidas: <span id="lives-val">3</span> | Puntuación: <span id="score-val">0</span> | Nivel: <span id="level-val">1</span></div>
        </header>
        <!-- Lienzo del juego (Canvas HTML5) -->
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <!-- CARGA MODULAR DE SCRIPTS -->
     <!-- SCRIPTS MODULARES -->
    <script src="js/core/game.js"></script>
    <script src="js/entities/player.js"></script>
    <script src="js/levels/level1.js"></script>
    <script src="js/levels/level2.js"></script>
    <script src="js/levels/level3.js"></script>

    <script src="js/core/game.js"></script>
    <script src="js/entities/player.js"></script>
    
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const player = new Player(50, 300);
        const keys = {};

        // Instanciar niveles de respaldo
        const levels = {
            1: new Level1(),
            2: new Level2(),
            3: new Level3()
        };

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Actualizar HUD
            document.getElementById("lives-val").innerText = game.lives;
            document.getElementById("score-val").innerText = game.score;
            document.getElementById("level-val").innerText = game.currentLevel;

            // Obtener nivel actual
            const currentMap = levels[game.currentLevel];
            currentMap.draw(ctx);

            // Lógica del jugador con plataformas del nivel
            player.handleInput(keys);
            player.update(currentMap.platforms);
            player.draw(ctx);

            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
    
</body>
</html>
