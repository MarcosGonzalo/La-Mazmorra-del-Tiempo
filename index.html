<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Mazmorra del Tiempo - EcoPrince 2D</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>⏳ La Mazmorra del Tiempo</h1>
            <div id="hud">Vidas: <span id="lives-val">3</span> | Puntuación: <span id="score-val">0</span> | Nivel: <span id="level-val">1</span></div>
        </header>
        <!-- Lienzo del juego (Canvas HTML5) -->
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <!-- CARGA MODULAR DE SCRIPTS -->
    <script src="js/core/game.js"></script>
    <script src="js/entities/player.js"></script>
    <script>
        // Bucle temporal de prueba del Core Developer
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const player = new Player(100, 300);
        const keys = {};

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Actualizar HUD en pantalla
            document.getElementById("lives-val").innerText = game.lives;
            document.getElementById("score-val").innerText = game.score;
            document.getElementById("level-val").innerText = game.currentLevel;

            // Lógica del jugador
            player.handleInput(keys);
            player.update();
            player.draw(ctx);

            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
